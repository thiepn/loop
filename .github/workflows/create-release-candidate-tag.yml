name: Create Release Candidate Tag

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: rc-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact RC tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read release-candidate version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]; then
            echo "package.json version is not a Loop 1.0 release candidate: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Install release browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Unit, soak, type and build verification
        run: |
          npm run check
          npm run build

      - name: Browser performance certification
        run: npm run cert:browser

      - name: Release-candidate browser matrix
        run: npm run test:rc

      - name: Create annotated RC tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $EXISTING, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$TAG already exists on the certified commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Loop $TAG release candidate"
          git push origin "$TAG"
